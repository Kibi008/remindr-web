{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Register{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <div class="form-group">
      <label for="username">Email address</label><small id="emailHelp" class="form-text text-muted"> (We'll never share your email with anyone else.)</small>
      <input type="text" class="form-control" id="username_id" name="username" aria-describedby="emailHelp" placeholder="Enter email">      
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" class="form-control" id="password_id" name="password" placeholder="Password">
    </div>
    <div class="form-check">
      <input type="checkbox" class="form-check-input" id="exampleCheck1">
      <label class="form-check-label" for="exampleCheck1">Check me out</label>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
</form>
{% endblock %}
